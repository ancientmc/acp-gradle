buildscript {
    repositories {
        mavenCentral()
        maven { url = 'https://maven.neoforged.net' }
    }
    dependencies {
        classpath files('plugins/acp.jar')
        classpath 'com.google.code.gson:gson:2.11.0'
        classpath 'commons-io:commons-io:2.18.0'
        classpath 'net.neoforged:srgutils:1.0.9'
        classpath 'org.apache.commons:commons-compress:1.27.1'
    }
}

plugins {
    id 'java-library'
}

repositories {
    maven { url = 'https://libraries.minecraft.net' }
    maven { url = 'https://maven.neoforged.net/' }
    maven { url = 'https://github.com/ancientmc/ancientmc-maven/raw/maven/' }
}

sourceSets {
    main
}

apply plugin: 'com.ancientmc.acp'

import com.ancientmc.acp.util.*

version = '0.0.1'

acp {
    data = "com.ancientmc:versions:${minecraft_version}"
    loader = 'risugami'
    modName = 'ruby'
}

// These are easy ways to run tasks as opposed to CLI or finding them in your IDE's menus.
tasks.named('decompile')
tasks.named('downloadModLoader')
tasks.named('runClient') { }
tasks.named('buildMod') { }

FileFilter srcFilter = (File file) -> !file.name.contains("acp")
FileFilter tempFilter = (File file) -> !file.name.equals('client.jar') && !file.name.endsWith('.json')
FileFilter runFilter = (File file) -> !file.name.contains('resources') && !file.name.contains('bin')

clean {
    if(file(Paths.DIR_SRC).exists()) delete(file(Paths.DIR_SRC).listFiles(srcFilter))
    if(file(Paths.DIR_RESOURCES).exists()) delete(file(Paths.DIR_RESOURCES).listFiles())
    if(file(Paths.DIR_VANILLA_SRC).exists()) delete(file(Paths.DIR_VANILLA_SRC))
    if(file(Paths.DIR_VANILLA_RESOURCES).exists()) delete(file(Paths.DIR_VANILLA_RESOURCES))
    if(file(Paths.DIR_TEMP).exists()) delete(file(Paths.DIR_TEMP).listFiles(tempFilter))
    if(file(Paths.DIR_RUN).exists()) delete(file(Paths.DIR_RUN).listFiles(runFilter))
}